name: moodle
services:
  db:
    # Moodle 5.2 requires PostgreSQL 17 or newer.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-db}
      POSTGRES_DB: moodle
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle"]
      interval: 10s
      timeout: 5s
      retries: 12
  moodle:
    # Code lives on a volume seeded from the image, so UI-installed plugins persist.
    image: ${MOODLE_IMAGE:-ghcr.io/remarkablecloud/moodle:5.2.2-r1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports: ["${HTTP_PORT:-8094}:80"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: ${DB_PASSWORD:-change-me-db}
      MOODLE_WWWROOT: ${SITE_URL:-http://localhost:8094}
    volumes:
      - moodle-code:/var/www/html
      - moodledata:/var/www/moodledata
volumes:
  db-data:
  moodle-code:
  moodledata:
