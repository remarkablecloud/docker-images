# RemarkableCloud n8n - standalone stack. SQLite (no external DB); persistent data volume.
#   docker compose up -d   # -> http://localhost:5678  (set up the owner account on first visit)
# Production runs behind a TLS-terminating proxy; the catalog sets N8N_PROTOCOL=https +
# WEBHOOK_URL/editor URLs from the app hostname, and N8N_PROXY_HOPS=1.
name: n8n

services:
  n8n:
    image: ${N8N_IMAGE:-ghcr.io/remarkablecloud/n8n:2.38.6-r1}
    restart: unless-stopped
    ports: ["${HTTP_PORT:-5678}:5678"]
    environment:
      N8N_PORT: "5678"
      GENERIC_TIMEZONE: ${TZ:-UTC}
      # Local (plain HTTP) needs secure cookies off; production sets this true over HTTPS.
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  n8n-data:
