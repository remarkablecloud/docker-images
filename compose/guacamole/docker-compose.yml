# Apache Guacamole - Coolify docker-compose deploy for the RemarkableCloud App Platform.
# Three containers: postgres (schema + a GENERATED admin seeded on first boot, no default
# guacadmin/guacadmin), guacd (the proxy daemon, internal), and the webapp (served at / via
# WEBAPP_CONTEXT=ROOT, behind Traefik). The broker injects GUAC_ADMIN_PASSWORD + GUAC_DB_PASSWORD.
services:
  guacdb:
    # RC image = postgres:16 with the Guacamole schema + a generated admin baked into initdb (Coolify's
    # compose deploy strips repo-relative bind mounts, so the init scripts can't be mounted from the repo).
    image: ghcr.io/remarkablecloud/guacamole-db:1.6.0-r1
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD}
      GUAC_ADMIN_USER: ${GUAC_ADMIN_USER:-admin}
      GUAC_ADMIN_PASSWORD: ${GUAC_ADMIN_PASSWORD}
    volumes:
      - guac-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole -d guacamole_db"]
      interval: 10s
      timeout: 5s
      retries: 12

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on:
      guacdb:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: guacdb
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD}
      WEBAPP_CONTEXT: ROOT
    expose:
      - "8080"

volumes:
  guac-pg:
