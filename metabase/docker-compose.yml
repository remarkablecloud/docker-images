name: metabase
services:
  db:
    # Metabase's own application state (dashboards, questions, users, settings) lives here.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-db}
      POSTGRES_DB: metabase
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 12
  metabase:
    # Stateless app: all real state is in the db service; /rc-data holds only the generated encryption key and admin password.
    image: ${METABASE_IMAGE:-ghcr.io/remarkablecloud/metabase:0.63.17.2-r1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports: ["${HTTP_PORT:-8096}:3000"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${DB_PASSWORD:-change-me-db}
      MB_SITE_URL: ${SITE_URL:-http://localhost:8096}
    volumes:
      - rc-data:/rc-data
volumes:
  pg-data:
  rc-data:
